services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookreads
      POSTGRES_USER: bookreads
      POSTGRES_PASSWORD: bookreads
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookreads"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
